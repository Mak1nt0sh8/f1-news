<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>F1 News</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/script.js" defer></script>
  </head>

  <body>
    <main class="page">
      <header class="site-header">
        <a class="site-brand" href="/" aria-label="F1 News home">
          <span class="brand-stripes" aria-hidden="true"></span>
          F1 NEWS
        </a>

        <nav class="page-nav" aria-label="Main navigation">
          <a id="nav-news" href="/" aria-current="page">News</a>
          <a id="nav-calendar" href="/calendar.html">Race calendar</a>
          <a id="nav-chat" href="/chat.html">Pit Wall chat</a>
        </nav>
      </header>

      <h1>F1 News</h1>

      <section class="news-section" aria-labelledby="news-title">
        <div class="section-heading">
          <h2 id="news-title">Latest F1 news</h2>
          <button id="refresh-news" type="button">Refresh news</button>
        </div>

        <label class="search-label" for="news-search">Search news</label>
        <input
          id="news-search"
          type="search"
          placeholder="Search drivers, teams, or headlines..."
        >

        <p id="news-message" role="status">Loading F1 news...</p>
        <div id="news-list" aria-busy="true"></div>
      </section>
    </main>

    <template id="news-card-template">
      <article class="news-card">
        <figure class="news-media" hidden>
          <img class="news-image" alt="" loading="lazy" decoding="async">
          <figcaption class="image-credit" hidden></figcaption>
        </figure>

        <div class="news-card-content">
          <h3></h3>
          <p class="news-metadata"></p>
          <a href="#" target="_blank" rel="noopener noreferrer">
            Read article
          </a>
        </div>
      </article>
    </template>
  </body>
</html>
